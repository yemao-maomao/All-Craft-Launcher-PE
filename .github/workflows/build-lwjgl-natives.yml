name: Build LWJGL Android Natives

# 编译 LWJGL 的 arm64 Android natives（liblwjgl.so / liblwjgl_opengl.so / liblwjgl_stb.so）。
# 仿造 FCL-Team/LWJGL-Pojav 的 ci_build_android.bash（BSD 许可开源库，非 FCL 源码）。
# 本机 Windows 无法编译（LWJGL 构建依赖 bash/ant/configure/make + Linux 版 NDK），
# 故此流程在 Linux runner 上执行，产物作为 artifact 下载后集成到 ACL-PE。

on:
  workflow_dispatch:   # 手动触发

jobs:
  build-natives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LWJGL-Pojav source
        uses: actions/checkout@v4
        with:
          repository: FCL-Team/LWJGL-Pojav
          path: LWJGL-Pojav

      - name: Install ant and JDK
        run: |
          sudo apt-get update
          sudo apt-get install -y ant openjdk-17-jdk-headless

      - name: Setup Android NDK (Linux)
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27-linux.zip
          unzip -q android-ndk-r27-linux.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r27" >> "$GITHUB_ENV"

      - name: Patch ci script (skip stale downloads)
        working-directory: LWJGL-Pojav
        run: |
          # libopenal.so 已从 FCL 仓库移除（改为 openal-soft-release.aar），原 wget 会 404 退出码 8
          # 故删除该下载并禁用 openal 绑定（openal 后续从 openal-soft 源码单独编译）
          python3 - <<'PY'
          import re
          with open('ci_build_android.bash') as f:
              c = f.read()
          c = re.sub(r'.*wget.*libopenal\.so.*\n', '', c)
          c = c.replace(
              'yes | ant -Dplatform.linux=true',
              'yes | ant -Dplatform.linux=true -Dbinding.openal=false'
          )
          with open('ci_build_android.bash', 'w') as f:
              f.write(c)
          print('patched ci_build_android.bash')
          PY

      - name: Build natives (arm64)
        working-directory: LWJGL-Pojav
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_HOME"
          export LWJGL_BUILD_ARCH=arm64
          export SKIP_LIBFFI=1
          export SKIP_FREETYPE=1
          # 不静默，便于失败时定位
          bash ci_build_android.bash

      - name: Upload natives
        uses: actions/upload-artifact@v4
        with:
          name: lwjgl-natives-arm64
          path: LWJGL-Pojav/bin/out/*.so

name: Build LWJGL Android Natives

# 编译 LWJGL 的 arm64 Android natives（liblwjgl.so / liblwjgl_opengl.so / liblwjgl_stb.so）。
# 仿造 FCL-Team/LWJGL-Pojav 的 ci_build_android.bash（BSD 许可开源库，非 FCL 源码）。
# 本机 Windows 无法编译（LWJGL 构建依赖 bash/ant/configure/make + Linux 版 NDK），
# 故此流程在 Linux runner 上执行，产物作为 artifact 下载后集成到 ACL-PE。

on:
  workflow_dispatch:   # 手动触发

jobs:
  build-natives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LWJGL-Pojav source
        uses: actions/checkout@v4
        with:
          repository: FCL-Team/LWJGL-Pojav
          path: LWJGL-Pojav

      - name: Install ant and JDK
        run: |
          sudo apt-get update
          sudo apt-get install -y ant openjdk-17-jdk-headless

      - name: Setup Android NDK (Linux)
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27-linux.zip
          unzip -q android-ndk-r27-linux.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r27" >> "$GITHUB_ENV"

      - name: Patch ci script (remove stale libopenal wget)
        working-directory: LWJGL-Pojav
        run: |
          # libopenal.so 已从 FCL 裸 .so 改为 aar，原 wget 会 404（退出码 8）
          # 删除该下载行；libopenal.so 改由下一步从 openal-soft-release.aar 提取
          sed -i '/wget.*libopenal\.so/d' ci_build_android.bash
          # NDK r27 的 jni.h 把 GetEnv/AttachCurrentThread 的 penv 参数从 void** 改为 JNIEnv**，
          # LWJGL 旧代码的 (void **)&env 强转会报 incompatible-pointer-types fatal error，去掉强转
          python3 -c "
import pathlib
p = pathlib.Path('modules/lwjgl/core/src/main/c/common_tools.c')
c = p.read_text()
c = c.replace('(void **)&env', '&env')
p.write_text(c)
print('patched common_tools.c')
"

      - name: Fetch libopenal.so (from openal-soft aar)
        working-directory: LWJGL-Pojav
        run: |
          mkdir -p bin/libs/native/linux/arm64/org/lwjgl/openal
          wget https://github.com/FCL-Team/FoldCraftLauncher/raw/main/FCL/libs/openal-soft-release.aar
          unzip -o openal-soft-release.aar jni/arm64-v8a/libopenal.so -d /tmp/openal
          cp /tmp/openal/jni/arm64-v8a/libopenal.so bin/libs/native/linux/arm64/org/lwjgl/openal/libopenal.so
          ls -la bin/libs/native/linux/arm64/org/lwjgl/openal/

      - name: Build natives (arm64)
        working-directory: LWJGL-Pojav
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_HOME"
          export LWJGL_BUILD_ARCH=arm64
          export SKIP_LIBFFI=1
          export SKIP_FREETYPE=1
          bash ci_build_android.bash

      - name: Upload natives
        uses: actions/upload-artifact@v4
        with:
          name: lwjgl-natives-arm64
          path: LWJGL-Pojav/bin/out/*.so
